<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <rect width="1000" height="660" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#345"/></marker></defs>
  <text x="50" y="28" font-size="16" font-weight="bold" fill="#123">Stroj za zapiranje čajnih škatlic · skupina A · 2 m · varianta 3 (leteča lepilna glava)</text>
  <text x="50" y="46" fill="#555">Trak teče ves čas in drsi pod škatlami, ki čakajo (brez lopatk). En voziček s 3 šobami prime škatlo, jo pelje, zalepi, stisne in spusti.</text>

  <!-- ========== TLORIS ========== -->
  <text x="50" y="74" font-weight="bold" fill="#123">TLORIS (pogled od zgoraj)</text>
  <rect x="0" y="120" width="48" height="100" fill="#eee" stroke="#999" stroke-dasharray="4 3"/>
  <text x="4" y="236" fill="#777" font-size="10">obstoječi</text><text x="4" y="248" fill="#777" font-size="10">dovod</text>
  <rect x="952" y="120" width="48" height="100" fill="#eee" stroke="#999" stroke-dasharray="4 3"/>
  <text x="955" y="236" fill="#777" font-size="10">obstoječi</text><text x="955" y="248" fill="#777" font-size="10">odvod</text>
  <rect x="50" y="120" width="900" height="100" fill="#dfe8f1" stroke="#345" stroke-width="1.5"/>
  <text x="60" y="134" fill="#345" font-size="9">drsni (akumulacijski) trak, 300 mm</text>
  <rect x="50" y="210" width="900" height="8" fill="#8a9"/>
  <text x="640" y="232" fill="#2a5" font-size="10">desno fiksno vodilo (flat board), inox</text>
  <rect x="50" y="140" width="225" height="5" fill="#c84"/>
  <text x="60" y="116" fill="#a62" font-size="10">levo vodilo, nastavljivo z ročico + števec</text>
  <path d="M300 100 L360 100" stroke="#345" stroke-width="2" marker-end="url(#a)"/>
  <text x="366" y="104" fill="#345" font-size="10">smer, kratka stranica naprej</text>

  <!-- čakajoče škatle (akumulacija) -->
  <g fill="#7b3b3b" opacity="0.85">
    <rect x="80" y="176" width="58" height="34"/>
    <rect x="140" y="176" width="58" height="34"/>
    <rect x="200" y="176" width="58" height="34"/>
  </g>
  <text x="80" y="170" font-size="9" fill="#7b3b3b">škatle čakajo, trak drsi pod njimi</text>
  <!-- S4, S1, C1 -->
  <circle cx="72" cy="160" r="6" fill="#fc0" stroke="#000"/><text x="58" y="158" font-size="9" text-anchor="end">S4</text>
  <circle cx="262" cy="160" r="6" fill="#fc0" stroke="#000"/><text x="244" y="160" font-size="9">S1</text>
  <rect x="268" y="150" width="8" height="62" fill="#555"/><text x="246" y="200" font-size="9" fill="#fff">C1</text>

  <!-- hod vozička -->
  <rect x="275" y="70" width="360" height="22" fill="#f3e3c3" stroke="#a62"/>
  <text x="282" y="85" font-size="10" fill="#753">linearna os (zobati jermen + servo), hod 800 mm, nad trakom ob strani</text>
  <!-- voziček v dveh legah -->
  <rect x="300" y="150" width="90" height="66" fill="none" stroke="#c00" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="302" y="146" font-size="9" fill="#c00">voziček: prijem</text>
  <rect x="470" y="150" width="90" height="66" fill="none" stroke="#c00" stroke-width="2"/>
  <rect x="486" y="176" width="58" height="34" fill="#7b3b3b" opacity="0.85"/>
  <rect x="490" y="186" width="50" height="5" fill="#e33"/>
  <rect x="478" y="168" width="8" height="10" fill="#e33"/><rect x="544" y="168" width="8" height="10" fill="#e33"/>
  <text x="470" y="146" font-size="9" fill="#c00">voziček: G1 + G2 + G3, stisk</text>
  <path d="M400 238 L460 238" stroke="#c00" stroke-width="2" marker-end="url(#a)"/>
  <path d="M460 250 L400 250" stroke="#999" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="402" y="264" font-size="9" fill="#555">nazaj prazen</text>
  <path d="M430 170 L470 160" stroke="#123" stroke-width="3"/><text x="404" y="128" font-size="9" fill="#123">inox zapora pokrova</text>

  <!-- odlaganje, kontrola, izmet -->
  <g fill="#7b3b3b" opacity="0.85"><rect x="680" y="176" width="58" height="34"/><rect x="880" y="176" width="58" height="34"/></g>
  <circle cx="760" cy="190" r="6" fill="#fc0" stroke="#000"/><text x="770" y="168" font-size="9">S3 kontrola pokrova</text>
  <rect x="862" y="136" width="14" height="30" fill="#555"/><text x="850" y="96" font-size="9">P potiskač izmeta</text>
  <rect x="852" y="100" width="40" height="18" fill="none" stroke="#555"/>

  <!-- meje zon -->
  <g stroke="#999" stroke-dasharray="3 3">
    <line x1="275" y1="60" x2="275" y2="560"/>
    <line x1="635" y1="60" x2="635" y2="560"/>
    <line x1="815" y1="60" x2="815" y2="560"/>
  </g>

  <!-- ========== STRANSKI POGLED ========== -->
  <text x="50" y="300" font-weight="bold" fill="#123">STRANSKI POGLED</text>
  <rect x="50" y="460" width="900" height="14" rx="7" fill="#dfe8f1" stroke="#345" stroke-width="1.5"/>
  <circle cx="57" cy="467" r="7" fill="#fff" stroke="#345"/><circle cx="943" cy="467" r="7" fill="#345"/>
  <text x="800" y="494" font-size="9">M + FU, enkoder E</text>
  <g stroke="#345" stroke-width="3"><line x1="80" y1="474" x2="80" y2="540"/><line x1="920" y1="474" x2="920" y2="540"/><line x1="500" y1="474" x2="500" y2="540"/></g>
  <text x="510" y="536" font-size="9">nastavljive noge, višina = obstoječa linija</text>
  <g fill="#7b3b3b" opacity="0.85">
    <rect x="80" y="430" width="58" height="30"/><rect x="140" y="430" width="58" height="30"/><rect x="200" y="430" width="58" height="30"/>
    <rect x="486" y="430" width="58" height="30"/>
    <rect x="680" y="430" width="58" height="30"/>
  </g>
  <path d="M138 430 L158 408" stroke="#7b3b3b" stroke-width="3"/><path d="M198 430 L218 408" stroke="#7b3b3b" stroke-width="3"/><path d="M258 430 L278 408" stroke="#7b3b3b" stroke-width="3"/>
  <rect x="268" y="440" width="8" height="20" fill="#555"/>
  <!-- linearna os in voziček -->
  <rect x="275" y="352" width="360" height="16" fill="#f3e3c3" stroke="#a62"/>
  <rect x="470" y="368" width="90" height="56" fill="#fff" stroke="#c00" stroke-width="2"/>
  <rect x="507" y="404" width="16" height="16" fill="#e33"/><text x="474" y="382" font-size="9" fill="#900">G1 zgoraj</text>
  <rect x="490" y="388" width="50" height="8" fill="#555"/><text x="474" y="396" font-size="8" fill="#fff">stisk</text>
  <text x="566" y="398" font-size="9" fill="#900">prijemalo s strani + G2, G3</text>
  <!-- energijska veriga in hot melt -->
  <path d="M330 352 C330 330 420 330 500 352" stroke="#666" stroke-width="5" fill="none"/>
  <text x="330" y="326" font-size="9" fill="#555">energijska veriga: grete cevi + kabli</text>
  <rect x="140" y="320" width="100" height="40" fill="#fdd" stroke="#c00"/><text x="146" y="338" font-size="9" fill="#900">HOT MELT enota</text><text x="146" y="351" font-size="9" fill="#900">3 šobe, ~170 °C</text>
  <path d="M240 340 L330 340" stroke="#c00" stroke-width="2"/>
  <circle cx="760" cy="410" r="6" fill="#fc0" stroke="#000"/>
  <rect x="140" y="310" width="740" height="168" fill="none" stroke="#0a7" stroke-dasharray="6 4"/>
  <text x="700" y="304" font-size="9" fill="#076">zaščitni pokrov PC + vrata z varn. stikali</text>
  <rect x="885" y="330" width="8" height="40" fill="#555"/><circle cx="889" cy="326" r="5" fill="#2c2"/><circle cx="889" cy="316" r="5" fill="#fc0"/><circle cx="889" cy="306" r="5" fill="#e33"/>
  <rect x="930" y="490" width="50" height="60" fill="#eee" stroke="#345"/><text x="934" y="520" font-size="8">el. omara</text><text x="934" y="532" font-size="8">PLC+HMI</text>

  <!-- ========== ZONE ========== -->
  <g font-size="10" fill="#123">
    <text x="62" y="578">0–500</text><text x="62" y="592" font-weight="bold">1 vhod in čakanje</text><text x="62" y="606">S4 polno, S1 + C1 stop</text>
    <text x="282" y="578">500–1300</text><text x="282" y="592" font-weight="bold">2 leteča lepilna glava (hod 800 mm)</text><text x="282" y="606">prijem → G1 linija → pokrov → G2, G3 pike → stisk ≥ 1 s → spust</text>
    <text x="642" y="578">1300–1700</text><text x="642" y="592" font-weight="bold">3 kontrola</text><text x="642" y="606">S3 pokrov zaprt?</text>
    <text x="822" y="578">1700–2000</text><text x="822" y="592" font-weight="bold">4 izhod</text><text x="822" y="606">izmet P</text>
  </g>
  <text x="50" y="640" font-size="10" fill="#555">S = senzor · C = zadrževalni cilinder · G = šoba hot melt · P = potiskač · M = motor z reduktorjem · FU = frekvenčnik · E = enkoder RLS. Mere v mm od vhoda.</text>
</svg>
