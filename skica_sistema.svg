<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="50" y="28" font-size="16" font-weight="bold" fill="#123">Stroj za zapiranje čajnih škatlic · skupina A · 2 m · merilo ~1:22</text>
  <text x="50" y="46" fill="#555">Trak teče ves čas. Šobe so fiksne in jih proži enkoder; škatlo držijo pritisni jermeni, ki tečejo s trakom (rešitev A).</text>

  <!-- ========== TLORIS ========== -->
  <text x="50" y="74" font-weight="bold" fill="#123">TLORIS (pogled od zgoraj)</text>
  <!-- obstoječi trakovi -->
  <rect x="0" y="120" width="48" height="100" fill="#eee" stroke="#999" stroke-dasharray="4 3"/>
  <text x="4" y="236" fill="#777" font-size="10">obstoječi</text>
  <text x="4" y="248" fill="#777" font-size="10">dovod</text>
  <rect x="952" y="120" width="48" height="100" fill="#eee" stroke="#999" stroke-dasharray="4 3"/>
  <text x="955" y="236" fill="#777" font-size="10">obstoječi</text>
  <text x="955" y="248" fill="#777" font-size="10">odvod</text>
  <!-- naš trak -->
  <rect x="50" y="120" width="900" height="100" fill="#dfe8f1" stroke="#345" stroke-width="1.5"/>
  <!-- desno fiksno vodilo (flat board) zgoraj v tlorisu = desna stran v smeri teka -->
  <rect x="50" y="210" width="900" height="8" fill="#8a9" />
  <text x="600" y="232" fill="#2a5" font-size="10">desno fiksno vodilo (flat board), inox</text>
  <!-- levo nastavljivo vodilo -->
  <rect x="162" y="128" width="788" height="6" fill="#c84" />
  <text x="300" y="116" fill="#a62" font-size="10">levo vodilo, nastavljivo z ročico + števec (širina škatle)</text>
  <!-- smer -->
  <path d="M60 100 L120 100" stroke="#345" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#345"/></marker></defs>
  <text x="126" y="104" fill="#345" font-size="10">smer, kratka stranica naprej</text>

  <!-- škatlice -->
  <g fill="#7b3b3b" opacity="0.85">
    <rect x="70" y="160" width="58" height="34"/>
    <rect x="200" y="176" width="58" height="34"/>
    <rect x="330" y="176" width="58" height="34"/>
    <rect x="470" y="176" width="58" height="34"/>
    <rect x="610" y="176" width="58" height="34"/>
    <rect x="760" y="176" width="58" height="34"/>
    <rect x="890" y="176" width="58" height="34"/>
  </g>

  <!-- meje stagov -->
  <g stroke="#999" stroke-dasharray="3 3">
    <line x1="162" y1="80" x2="162" y2="560"/>
    <line x1="275" y1="80" x2="275" y2="560"/>
    <line x1="410" y1="80" x2="410" y2="560"/>
    <line x1="545" y1="80" x2="545" y2="560"/>
    <line x1="680" y1="80" x2="680" y2="560"/>
    <line x1="860" y1="80" x2="860" y2="560"/>
  </g>

  <!-- elementi v tlorisu -->
  <circle cx="150" cy="150" r="6" fill="#fc0" stroke="#000"/><text x="140" y="146" font-size="9" text-anchor="end">S1</text>
  <rect x="155" y="138" width="10" height="70" fill="#555"/><text x="168" y="206" font-size="9">C1 zadrž.</text>
  <circle cx="300" cy="150" r="6" fill="#fc0" stroke="#000"/><text x="290" y="146" font-size="9" text-anchor="end">S2</text>
  <rect x="330" y="186" width="50" height="6" fill="#e33"/><text x="330" y="182" font-size="9" fill="#c00">G1 linija</text>
  <path d="M420 200 L470 186" stroke="#123" stroke-width="3"/><text x="418" y="160" font-size="9">zapora pokrova (inox plug)</text>
  <rect x="560" y="140" width="10" height="10" fill="#e33"/><text x="574" y="148" font-size="9" fill="#c00">G2</text>
  <rect x="560" y="198" width="10" height="10" fill="#e33"/><text x="574" y="206" font-size="9" fill="#c00">G3</text>
  <circle cx="640" cy="190" r="6" fill="#fc0" stroke="#000"/><text x="650" y="168" font-size="9">S3 kontrola pokrova</text>
  <rect x="690" y="136" width="160" height="8" fill="#468"/><rect x="690" y="202" width="160" height="8" fill="#468"/>
  <text x="700" y="162" font-size="9" fill="#246">stranska pritisna jermena</text>
  <rect x="870" y="136" width="14" height="30" fill="#555"/><text x="868" y="96" font-size="9">P potiskač izmeta</text>
  <rect x="862" y="78" width="40" height="22" fill="none" stroke="#555"/><text x="866" y="92" font-size="8">zabojnik</text>

  <!-- ========== STRANSKI POGLED ========== -->
  <text x="50" y="300" font-weight="bold" fill="#123">STRANSKI POGLED</text>
  <!-- trak -->
  <rect x="50" y="440" width="900" height="14" rx="7" fill="#dfe8f1" stroke="#345" stroke-width="1.5"/>
  <circle cx="57" cy="447" r="7" fill="#fff" stroke="#345"/>
  <circle cx="943" cy="447" r="7" fill="#345"/>
  <text x="900" y="474" font-size="9">M + FU, enkoder E</text>
  <!-- noge -->
  <g stroke="#345" stroke-width="3"><line x1="80" y1="454" x2="80" y2="520"/><line x1="920" y1="454" x2="920" y2="520"/><line x1="500" y1="454" x2="500" y2="520"/></g>
  <text x="510" y="516" font-size="9">nastavljive noge, višina = obstoječa linija</text>
  <!-- škatle stranski -->
  <g fill="#7b3b3b" opacity="0.85">
    <rect x="200" y="410" width="58" height="30"/>
    <rect x="330" y="410" width="58" height="30"/>
    <rect x="470" y="410" width="58" height="30"/>
    <rect x="610" y="410" width="58" height="30"/>
    <rect x="760" y="410" width="58" height="30"/>
  </g>
  <!-- odprt pokrov na prvi škatli -->
  <path d="M258 410 L280 385" stroke="#7b3b3b" stroke-width="3"/>
  <path d="M388 410 L410 388" stroke="#7b3b3b" stroke-width="3"/>
  <!-- C1 -->
  <rect x="158" y="420" width="8" height="20" fill="#555"/>
  <!-- G1 šoba nad -->
  <rect x="345" y="380" width="14" height="22" fill="#e33"/><text x="330" y="372" font-size="9" fill="#c00">G1 + greta cev</text>
  <!-- hot melt enota -->
  <rect x="300" y="315" width="90" height="40" fill="#fdd" stroke="#c00"/><text x="306" y="334" font-size="9" fill="#900">HOT MELT enota</text><text x="306" y="347" font-size="9" fill="#900">4 kanali, ~170 °C</text>
  <path d="M352 355 L352 380" stroke="#c00" stroke-width="2"/>
  <path d="M390 335 C470 335 560 340 565 405" stroke="#c00" stroke-width="2" fill="none"/>
  <!-- zgornji pritisni jermen -->
  <rect x="425" y="396" width="250" height="12" rx="6" fill="#468"/>
  <text x="430" y="390" font-size="9" fill="#246">zgornji pritisni jermen, višina z ročico + števec</text>
  <!-- S3 -->
  <circle cx="640" cy="378" r="6" fill="#fc0" stroke="#000"/>
  <!-- zaščita -->
  <rect x="140" y="360" width="740" height="98" fill="none" stroke="#0a7" stroke-dasharray="6 4"/>
  <text x="700" y="352" font-size="9" fill="#076">zaščitni pokrov PC + vrata z varn. stikali</text>
  <!-- svetlobni stolpec -->
  <rect x="885" y="330" width="8" height="40" fill="#555"/><circle cx="889" cy="326" r="5" fill="#2c2"/><circle cx="889" cy="316" r="5" fill="#fc0"/><circle cx="889" cy="306" r="5" fill="#e33"/>
  <!-- omara -->
  <rect x="930" y="470" width="50" height="60" fill="#eee" stroke="#345"/><text x="934" y="500" font-size="8">el. omara</text><text x="934" y="512" font-size="8">PLC+HMI</text>

  <!-- ========== ZONE ========== -->
  <g font-size="10" fill="#123">
    <text x="62" y="560">0–250</text><text x="62" y="574" font-weight="bold">1 vhod</text><text x="62" y="588">S1, C1 zadrž.</text>
    <text x="168" y="560">250–500</text><text x="168" y="574" font-weight="bold">2 poravnava</text><text x="168" y="588">ob desno vodilo</text>
    <text x="282" y="560">500–800</text><text x="282" y="574" font-weight="bold">3 lepilo zgoraj</text><text x="282" y="588">S2, G1 linija</text>
    <text x="416" y="560">800–1100</text><text x="416" y="574" font-weight="bold">4 zapiranje pokrova</text><text x="416" y="588">plug + zgornji jermen</text>
    <text x="552" y="560">1100–1400</text><text x="552" y="574" font-weight="bold">5 stranska krilca</text><text x="552" y="588">G2, G3 pike, S3</text>
    <text x="686" y="560">1400–1800</text><text x="686" y="574" font-weight="bold">6 stisk ≥ 1 s</text><text x="686" y="588">zgoraj + strani</text>
    <text x="866" y="560">1800–2000</text><text x="866" y="574" font-weight="bold">7 izhod</text><text x="866" y="588">izmet P</text>
  </g>
  <text x="50" y="620" font-size="10" fill="#555">S = senzor · C = cilinder · G = šoba hot melt · P = potiskač · M = motor z reduktorjem · FU = frekvenčnik · E = enkoder RLS. Mere v mm od vhoda.</text>
</svg>
