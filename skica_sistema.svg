<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <rect width="1000" height="660" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#345"/></marker></defs>
  <text x="50" y="28" font-size="16" font-weight="bold" fill="#123">Stroj za lepljenje čajnih škatlic · skupina A · shema (po Lukovem 3D konceptu)</text>
  <text x="50" y="46" fill="#555">Škatle se ves čas peljejo. Fiksne šobe proži enkoder, kriva inox vodila zaprejo pokrov, pritisni jermeni ga držijo ≥ 1 s.</text>

  <!-- ========== TLORIS ========== -->
  <text x="50" y="74" font-weight="bold" fill="#123">TLORIS (pogled od zgoraj)</text>
  <!-- vhodni trak -->
  <rect x="20" y="130" width="190" height="80" fill="#dfe8f1" stroke="#345" stroke-width="1.5"/>
  <!-- glavni del v ohišju 2000 mm -->
  <rect x="210" y="130" width="560" height="80" fill="#dfe8f1" stroke="#345" stroke-width="1.5"/>
  <!-- izhodni trak -->
  <rect x="770" y="130" width="200" height="80" fill="#dfe8f1" stroke="#345" stroke-width="1.5"/>
  <rect x="20" y="202" width="950" height="7" fill="#8a9"/>
  <text x="560" y="224" fill="#2a5" font-size="10">desno fiksno vodilo (flat board), inox</text>
  <rect x="120" y="132" width="650" height="5" fill="#c84"/>
  <text x="300" y="124" fill="#a62" font-size="10">levo vodilo, nastavljivo z ročnim kolesom + števec (širina škatle)</text>
  <!-- ohišje -->
  <rect x="210" y="96" width="560" height="140" fill="none" stroke="#0a7" stroke-dasharray="6 4"/>
  <path d="M212 90 L768 90" stroke="#345" marker-end="url(#a)"/><path d="M768 90 L212 90" stroke="#345" marker-end="url(#a)"/>
  <text x="460" y="86" font-weight="bold" fill="#345">2000 mm</text>
  <path d="M985 132 L985 208" stroke="#345" marker-end="url(#a)"/><text x="958" y="126" font-size="10">300 mm</text>

  <!-- škatle -->
  <g fill="#6aa84f" opacity="0.9">
    <rect x="40" y="165" width="50" height="34"/><rect x="120" y="165" width="50" height="34"/>
    <rect x="250" y="165" width="50" height="34"/><rect x="380" y="165" width="50" height="34"/>
    <rect x="510" y="165" width="50" height="34"/><rect x="640" y="165" width="50" height="34"/>
    <rect x="800" y="165" width="50" height="34"/><rect x="900" y="165" width="50" height="34"/>
  </g>
  <!-- 1 vhod: S1, C1 -->
  <circle cx="182" cy="150" r="6" fill="#fc0" stroke="#000"/><text x="176" y="146" font-size="9" text-anchor="end">S1</text>
  <rect x="192" y="140" width="8" height="62" fill="#555"/><text x="168" y="228" font-size="9">C1</text>
  <!-- 2 šobe -->
  <rect x="320" y="176" width="40" height="6" fill="#e33"/>
  <rect x="330" y="140" width="10" height="10" fill="#e33"/><rect x="330" y="194" width="10" height="8" fill="#e33"/>
  <circle cx="300" cy="150" r="6" fill="#fc0" stroke="#000"/><text x="296" y="146" font-size="9" text-anchor="end">S2</text>
  <!-- 3 zapiranje pokrova -->
  <path d="M420 198 C450 196 470 186 500 182" stroke="#123" stroke-width="4" fill="none"/>
  <!-- 4 pritisni jermeni -->
  <rect x="560" y="160" width="190" height="10" rx="5" fill="#2e8b57"/>
  <rect x="560" y="190" width="190" height="10" rx="5" fill="#2e8b57" opacity="0.6"/>
  <!-- 5/6 izhod -->
  <circle cx="790" cy="150" r="6" fill="#fc0" stroke="#000"/><text x="800" y="146" font-size="9">S3</text>
  <rect x="955" y="140" width="10" height="30" fill="#555"/>
  <rect x="930" y="232" width="40" height="22" fill="none" stroke="#555"/><text x="932" y="268" font-size="9">zabojnik</text>
  <!-- številke -->
  <g font-size="11" font-weight="bold" fill="#fff">
    <circle cx="110" cy="112" r="10" fill="#1f4e9c"/><text x="106" y="116">1</text>
    <circle cx="340" cy="112" r="10" fill="#1f4e9c"/><text x="336" y="116">2</text>
    <circle cx="460" cy="112" r="10" fill="#1f4e9c"/><text x="456" y="116">3</text>
    <circle cx="655" cy="112" r="10" fill="#1f4e9c"/><text x="651" y="116">4</text>
    <circle cx="860" cy="112" r="10" fill="#1f4e9c"/><text x="856" y="116">5</text>
    <circle cx="960" cy="112" r="10" fill="#1f4e9c"/><text x="956" y="116">6</text>
  </g>
  <path d="M60 250 L120 250" stroke="#345" stroke-width="2" marker-end="url(#a)"/><text x="126" y="254" fill="#345" font-size="10">smer, kratka stranica naprej</text>

  <!-- ========== STRANSKI POGLED ========== -->
  <text x="50" y="300" font-weight="bold" fill="#123">STRANSKI POGLED</text>
  <rect x="20" y="460" width="190" height="12" rx="6" fill="#dfe8f1" stroke="#345"/>
  <rect x="210" y="460" width="560" height="12" rx="6" fill="#dfe8f1" stroke="#345" stroke-width="1.5"/>
  <rect x="770" y="460" width="200" height="12" rx="6" fill="#dfe8f1" stroke="#345"/>
  <rect x="10" y="470" width="22" height="22" fill="#2a5bd7"/><text x="8" y="506" font-size="9">M1</text>
  <rect x="955" y="470" width="22" height="22" fill="#2a5bd7"/><text x="952" y="506" font-size="9">M2</text>
  <text x="560" y="490" font-size="9">M + FU, enkoder E na glavnem traku</text>
  <g stroke="#345" stroke-width="3"><line x1="60" y1="472" x2="60" y2="540"/><line x1="230" y1="472" x2="230" y2="540"/><line x1="750" y1="472" x2="750" y2="540"/><line x1="930" y1="472" x2="930" y2="540"/></g>
  <!-- škatle -->
  <g fill="#6aa84f" opacity="0.9">
    <rect x="40" y="432" width="50" height="28"/><rect x="120" y="432" width="50" height="28"/>
    <rect x="250" y="432" width="50" height="28"/><rect x="380" y="432" width="50" height="28"/>
    <rect x="510" y="432" width="50" height="28"/><rect x="640" y="432" width="50" height="28"/>
    <rect x="800" y="432" width="50" height="28"/>
  </g>
  <path d="M90 432 L108 410" stroke="#6aa84f" stroke-width="3"/><path d="M170 432 L188 410" stroke="#6aa84f" stroke-width="3"/>
  <path d="M300 432 L318 410" stroke="#6aa84f" stroke-width="3"/><path d="M430 432 L446 414" stroke="#6aa84f" stroke-width="3"/>
  <rect x="192" y="440" width="8" height="20" fill="#555"/>
  <!-- šobe -->
  <rect x="325" y="400" width="14" height="22" fill="#e33"/><rect x="345" y="400" width="14" height="22" fill="#e33"/>
  <text x="300" y="392" font-size="9" fill="#900">šobe G1 (zgoraj), G2 + G3 (strani)</text>
  <!-- hot melt spodaj -->
  <rect x="300" y="500" width="110" height="40" fill="#fdd" stroke="#c00"/><text x="306" y="518" font-size="9" fill="#900">HOT MELT enota</text><text x="306" y="531" font-size="9" fill="#900">pod trakom, ~170 °C</text>
  <path d="M355 500 C355 470 250 380 332 400" stroke="#c00" stroke-width="2" fill="none"/>
  <!-- kriva vodila -->
  <path d="M440 410 C470 410 490 425 505 432" stroke="#123" stroke-width="4" fill="none"/>
  <text x="430" y="400" font-size="9">kriva inox vodila zaprejo pokrov</text>
  <!-- pritisni jermeni -->
  <rect x="560" y="418" width="190" height="12" rx="6" fill="#2e8b57"/>
  <circle cx="566" cy="424" r="6" fill="#999"/><circle cx="744" cy="424" r="6" fill="#999"/>
  <text x="566" y="410" font-size="9" fill="#1e6b3e">pritisni jermen 600 mm, višina z ročnim kolesom</text>
  <!-- S3 + izmet -->
  <circle cx="790" cy="410" r="6" fill="#fc0" stroke="#000"/>
  <rect x="955" y="434" width="10" height="26" fill="#555"/>
  <!-- ohišje, svetila, omara -->
  <rect x="210" y="340" width="560" height="136" fill="none" stroke="#0a7" stroke-dasharray="6 4"/>
  <text x="214" y="334" font-size="9" fill="#076">ohišje PC + vrata z varn. stikali</text>
  <rect x="740" y="300" width="8" height="40" fill="#555"/><circle cx="744" cy="296" r="5" fill="#2c2"/><circle cx="744" cy="286" r="5" fill="#fc0"/><circle cx="744" cy="276" r="5" fill="#e33"/>
  <rect x="560" y="500" width="110" height="46" fill="#eee" stroke="#345"/><text x="566" y="518" font-size="9">el. omara pod trakom</text><text x="566" y="532" font-size="9">PLC + HMI, gobi</text>

  <!-- legenda -->
  <g font-size="10" fill="#123">
    <text x="50" y="580" font-weight="bold">1 vhodni trak</text><text x="50" y="594">S1 + C1 razmak, enkoder</text>
    <text x="210" y="580" font-weight="bold">2 lepilne šobe</text><text x="210" y="594">S2 začetek/konec škatle</text>
    <text x="380" y="580" font-weight="bold">3 zapiranje pokrova</text><text x="380" y="594">kriva inox vodila</text>
    <text x="540" y="580" font-weight="bold">4 pritisni jermeni</text><text x="540" y="594">stisk ≥ 1 s med vožnjo</text>
    <text x="710" y="580" font-weight="bold">5 izhodni trak</text><text x="710" y="594">S3 kontrola pokrova</text>
    <text x="860" y="580" font-weight="bold">6 izmet</text><text x="860" y="594">potiskač v zabojnik</text>
  </g>
  <text x="50" y="630" font-size="10" fill="#555">S = senzor · C1 = zadrževalni cilinder · G = šoba hot melt · M = motor z reduktorjem · FU = frekvenčnik · E = enkoder RLS. Shema, mere niso v merilu.</text>
</svg>
