<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <rect width="1000" height="700" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#345"/></marker></defs>
  <text x="50" y="28" font-size="16" font-weight="bold" fill="#123">Kontrola jabolčnega čipsa · skupina A · naloga 2 · 4 m</text>
  <text x="50" y="46" fill="#555">Razprši → pospeši (brez prekrivanja) → pregled obeh strani v letu → zračni izpih slabih → dobre v škatlo na tehtnici.</text>

  <!-- ========== STRANSKI POGLED ========== -->
  <text x="50" y="74" font-weight="bold" fill="#123">STRANSKI POGLED</text>
  <!-- tla -->
  <line x1="20" y1="520" x2="980" y2="520" stroke="#999" stroke-width="2"/>
  <!-- sušilec -->
  <rect x="20" y="110" width="110" height="110" fill="#eee" stroke="#999" stroke-dasharray="4 3"/>
  <text x="34" y="160" fill="#777">SUŠILEC</text><text x="34" y="174" fill="#777" font-size="9">(naročnik)</text>
  <path d="M110 220 L110 250" stroke="#b5651d" stroke-width="2" marker-end="url(#a)"/>
  <!-- dimenzija 4000 -->
  <path d="M52 92 L948 92" stroke="#345" marker-end="url(#a)"/><path d="M948 92 L52 92" stroke="#345" marker-end="url(#a)"/>
  <text x="470" y="88" font-weight="bold" fill="#345">4000 mm</text>

  <!-- 1 vibracijski dodajalnik 0–800 -->
  <path d="M50 255 L230 275 L230 290 L50 270 Z" fill="#cfd8e3" stroke="#345"/>
  <rect x="80" y="292" width="120" height="24" fill="#888"/><text x="88" y="308" font-size="9" fill="#fff">vibrator</text>
  <g fill="#c8a24a"><ellipse cx="80" cy="254" rx="10" ry="3"/><ellipse cx="96" cy="255" rx="10" ry="3"/><ellipse cx="88" cy="251" rx="10" ry="3"/><ellipse cx="140" cy="262" rx="9" ry="3"/><ellipse cx="180" cy="267" rx="9" ry="3"/></g>
  <line x1="140" y1="316" x2="140" y2="520" stroke="#345" stroke-width="3"/>

  <!-- 2 pospeševalni trak 800–2400, višina ~1000 mm -->
  <rect x="230" y="290" width="360" height="12" rx="6" fill="#dfe8f1" stroke="#345" stroke-width="1.5"/>
  <circle cx="236" cy="296" r="6" fill="#fff" stroke="#345"/><circle cx="584" cy="296" r="6" fill="#345"/>
  <g fill="#c8a24a"><ellipse cx="270" cy="288" rx="9" ry="2.5"/><ellipse cx="330" cy="288" rx="9" ry="2.5"/><ellipse cx="400" cy="288" rx="9" ry="2.5"/><ellipse cx="470" cy="288" rx="9" ry="2.5"/><ellipse cx="540" cy="288" rx="9" ry="2.5"/></g>
  <text x="260" y="276" font-size="9" fill="#345">živilski trak, 20+ m/min (dovod ~5 m/min) → rezine se razmaknejo</text>
  <g stroke="#345" stroke-width="3"><line x1="260" y1="302" x2="260" y2="520"/><line x1="560" y1="302" x2="560" y2="520"/></g>
  <rect x="566" y="306" width="22" height="22" fill="#2a5bd7"/><text x="540" y="342" font-size="9">M + FU + E</text>
  <!-- višina 1000 -->
  <path d="M220 296 L220 518" stroke="#345" marker-end="url(#a)"/><text x="186" y="420" font-size="9" fill="#345">~1000</text>

  <!-- 3 pregled in izmet 2400–2800 -->
  <!-- lok leta -->
  <path d="M590 292 C620 290 650 300 690 330" stroke="#c8a24a" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <path d="M640 300 C650 330 650 360 640 400" stroke="#c00" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <ellipse cx="632" cy="296" rx="8" ry="2.5" fill="#c8a24a"/>
  <!-- zgornja kamera 500 nad -->
  <rect x="612" y="180" width="40" height="22" fill="#333"/><path d="M620 202 L632 296 L644 202" fill="#9cf" opacity="0.35"/>
  <text x="658" y="186" font-size="9">kamera zgoraj + luč</text>
  <path d="M680 200 L680 294" stroke="#345" marker-end="url(#a)"/><path d="M680 294 L680 200" stroke="#345" marker-end="url(#a)"/><text x="684" y="250" font-size="9" fill="#345">500</text>
  <!-- spodnja kamera 500 pod -->
  <rect x="612" y="392" width="40" height="22" fill="#333"/><path d="M620 392 L632 300 L644 392" fill="#9cf" opacity="0.35"/>
  <rect x="610" y="388" width="44" height="4" fill="#9cf"/>
  <text x="658" y="412" font-size="9">kamera spodaj + steklo + zračna zavesa</text>
  <path d="M600 300 L600 390" stroke="#345" marker-end="url(#a)"/><path d="M600 390 L600 300" stroke="#345" marker-end="url(#a)"/><text x="574" y="350" font-size="9" fill="#345">500</text>
  <!-- letev šob -->
  <rect x="664" y="300" width="16" height="10" fill="#e33"/><text x="686" y="306" font-size="9" fill="#c00">letev ventilov (izpih)</text>
  <path d="M672 312 L660 330" stroke="#c00" stroke-width="2" marker-end="url(#a)"/>
  <!-- žleb za izmet -->
  <path d="M630 420 L650 470 L670 470 L690 420" fill="#fde" stroke="#c00"/>
  <rect x="620" y="470" width="80" height="48" fill="none" stroke="#c00"/><text x="626" y="498" font-size="9" fill="#c00">IZMET</text>
  <!-- zrak -->
  <rect x="520" y="440" width="40" height="70" rx="10" fill="#eee" stroke="#345"/><text x="522" y="478" font-size="8">zrak 10 L</text>

  <!-- 4 odvod v škatlo 2800–4000 -->
  <rect x="690" y="340" width="220" height="12" rx="6" fill="#dfe8f1" stroke="#345" stroke-width="1.5"/>
  <circle cx="696" cy="346" r="6" fill="#fff" stroke="#345"/><circle cx="904" cy="346" r="6" fill="#345"/>
  <g fill="#c8a24a"><ellipse cx="740" cy="338" rx="9" ry="2.5"/><ellipse cx="800" cy="338" rx="9" ry="2.5"/><ellipse cx="860" cy="338" rx="9" ry="2.5"/></g>
  <text x="720" y="330" font-size="9">odvodni trak, dobre rezine</text>
  <g stroke="#345" stroke-width="3"><line x1="720" y1="352" x2="720" y2="520"/></g>
  <path d="M912 352 L930 400" stroke="#c8a24a" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="900" y="400" width="70" height="70" fill="#f5e6c8" stroke="#8a6d3b"/><text x="908" y="440" font-size="9">ŠKATLA</text>
  <rect x="895" y="470" width="80" height="14" fill="#555"/><text x="900" y="500" font-size="9">tehtnica</text>

  <!-- ohišje -->
  <rect x="580" y="160" width="130" height="300" fill="none" stroke="#0a7" stroke-dasharray="6 4"/>
  <text x="584" y="154" font-size="9" fill="#076">zaprto ohišje vizije (luč, prah)</text>
  <rect x="380" y="430" width="90" height="70" fill="#eee" stroke="#345"/><text x="386" y="454" font-size="9">el. omara</text><text x="386" y="468" font-size="9">PLC + PC vizija</text><text x="386" y="482" font-size="9">HMI</text>

  <!-- ========== TLORIS ========== -->
  <text x="50" y="560" font-weight="bold" fill="#123">TLORIS</text>
  <path d="M50 575 L230 575 L230 655 L50 655 Z" fill="#cfd8e3" stroke="#345"/>
  <rect x="230" y="575" width="360" height="80" fill="#dfe8f1" stroke="#345"/>
  <rect x="590" y="575" width="100" height="80" fill="#fff2f2" stroke="#c00"/>
  <rect x="690" y="590" width="220" height="50" fill="#dfe8f1" stroke="#345"/>
  <rect x="910" y="585" width="60" height="60" fill="#f5e6c8" stroke="#8a6d3b"/>
  <g fill="#c8a24a"><ellipse cx="80" cy="600" rx="9" ry="7"/><ellipse cx="95" cy="610" rx="9" ry="7"/><ellipse cx="85" cy="625" rx="9" ry="7"/><ellipse cx="160" cy="595" rx="8" ry="6"/><ellipse cx="170" cy="630" rx="8" ry="6"/>
    <ellipse cx="280" cy="590" rx="8" ry="6"/><ellipse cx="320" cy="635" rx="8" ry="6"/><ellipse cx="370" cy="608" rx="8" ry="6"/><ellipse cx="430" cy="585" rx="8" ry="6"/><ellipse cx="480" cy="640" rx="8" ry="6"/><ellipse cx="540" cy="612" rx="8" ry="6"/>
    <ellipse cx="760" cy="605" rx="8" ry="6"/><ellipse cx="840" cy="625" rx="8" ry="6"/></g>
  <circle cx="530" cy="612" r="4" fill="#222"/>
  <g fill="#e33"><rect x="660" y="580" width="6" height="8"/><rect x="660" y="592" width="6" height="8"/><rect x="660" y="604" width="6" height="8"/><rect x="660" y="616" width="6" height="8"/><rect x="660" y="628" width="6" height="8"/><rect x="660" y="640" width="6" height="8"/></g>
  <text x="596" y="590" font-size="8" fill="#c00">2 kameri</text><text x="596" y="650" font-size="8" fill="#c00">letev šob</text>

  <!-- številke -->
  <g font-size="10" fill="#123">
    <text x="60" y="672" font-weight="bold">1 vibracijski dodajalnik</text><text x="60" y="686">0–800 mm, razprši</text>
    <text x="250" y="672" font-weight="bold">2 pospeševalni trak</text><text x="250" y="686">800–2400 mm, ni prekrivanja</text>
    <text x="560" y="672" font-weight="bold">3 vizija + izmet</text><text x="560" y="686">2400–2800 mm</text>
    <text x="740" y="672" font-weight="bold">4 odvod v škatlo</text><text x="740" y="686">2800–4000 mm, tehtnica</text>
  </g>
</svg>
