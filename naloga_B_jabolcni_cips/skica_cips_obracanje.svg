<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Helvetica, Arial, sans-serif" font-size="11">
  <rect width="1000" height="720" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#345"/></marker></defs>
  <text x="40" y="28" font-size="16" font-weight="bold" fill="#123">Kontrola jabolčnega čipsa · varianta z obračanjem · 2 traka, 4 m</text>
  <text x="40" y="46" fill="#555">Rezina pade s traka 1 na trak 2 in se pri tem obrne. Obe kameri gledata samo od zgoraj, vsaka eno stran rezine.</text>

  <line x1="20" y1="600" x2="980" y2="600" stroke="#999" stroke-width="2"/>
  <text x="24" y="616" font-size="9" fill="#777">tla</text>
  <g stroke="#ccc" stroke-dasharray="2 4"><line x1="40" y1="400" x2="960" y2="400"/><line x1="40" y1="300" x2="960" y2="300"/></g>
  <text x="24" y="396" font-size="9" fill="#777">1,0 m</text><text x="24" y="296" font-size="9" fill="#777">1,5 m</text>

  <!-- sušilec -->
  <rect x="20" y="300" width="90" height="90" fill="#eee" stroke="#999" stroke-dasharray="4 3"/>
  <text x="30" y="340" fill="#777">SUŠILEC</text><text x="30" y="354" fill="#777" font-size="9">izhod na 1 m</text>

  <!-- trak 1: 0–2,2 m, poševno 1,0 → ~1,55 m -->
  <line x1="100" y1="404" x2="520" y2="292" stroke="#345" stroke-width="12" stroke-linecap="round" opacity="0.25"/>
  <line x1="100" y1="404" x2="520" y2="292" stroke="#345" stroke-width="2"/>
  <circle cx="100" cy="404" r="7" fill="#fff" stroke="#345"/><circle cx="520" cy="292" r="7" fill="#345"/>
  <text x="180" y="356" font-size="10" fill="#345" transform="rotate(-15 180 356)">TRAK 1, poševno ~15°, 2,2 m</text>
  <g fill="#c8a24a">
    <ellipse cx="150" cy="390" rx="9" ry="3" transform="rotate(-15 150 390)"/><ellipse cx="250" cy="364" rx="9" ry="3" transform="rotate(-15 250 364)"/>
    <ellipse cx="350" cy="337" rx="9" ry="3" transform="rotate(-15 350 337)"/><ellipse cx="450" cy="310" rx="9" ry="3" transform="rotate(-15 450 310)"/>
  </g>
  <!-- označena stran A -->
  <rect x="104" y="414" width="22" height="22" fill="#2a5bd7"/><text x="100" y="450" font-size="9">M1</text>

  <!-- kamera 1 nad trakom 1 pri ~1,7 m -->
  <rect x="404" y="210" width="40" height="22" fill="#333"/><path d="M412 232 L424 318 L436 232" fill="#9cf" opacity="0.35"/>
  <text x="352" y="204" font-size="9">KAMERA 1: stran A</text>
  <path d="M424 300 L516 276" stroke="#c00" marker-end="url(#a)"/><path d="M516 276 L424 300" stroke="#c00" marker-end="url(#a)"/>
  <text x="440" y="270" font-size="9" fill="#c00">0,5 m</text>

  <!-- izpih 1 na glavi traku 1 -->
  <rect x="534" y="270" width="14" height="10" fill="#e33"/><text x="552" y="268" font-size="9" fill="#c00">izpih 1</text>
  <path d="M540 282 L536 306" stroke="#c00" stroke-width="2" marker-end="url(#a)"/>
  <path d="M528 300 C526 330 520 360 512 400" stroke="#c00" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <path d="M480 405 L540 405 L530 470 L490 470 Z" fill="#fde" stroke="#c00"/>

  <!-- obračanje: padec na trak 2 -->
  <path d="M526 292 C548 292 560 305 568 336" stroke="#c8a24a" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <g transform="translate(548 302) rotate(60)"><ellipse rx="9" ry="3" fill="#c8a24a"/></g>
  <g transform="translate(562 318) rotate(130)"><ellipse rx="9" ry="3" fill="#a0782a"/></g>
  <path d="M574 300 A16 16 0 1 1 556 290" stroke="#b5651d" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="586" y="300" font-size="9" fill="#b5651d">rezina se obrne</text>
  <text x="586" y="312" font-size="9" fill="#b5651d">padec ~150 mm, zamik ~60 mm</text>
  <!-- prag/rob za obračanje -->
  <path d="M556 336 L566 330" stroke="#123" stroke-width="3"/><text x="476" y="250" font-size="9" fill="#123">nastavljiv prag sproži obrat</text>
  <path d="M520 254 L558 328" stroke="#123" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- trak 2: 2,2–4,0 m, vodoravno na ~1,3 m -->
  <line x1="560" y1="340" x2="900" y2="340" stroke="#345" stroke-width="12" stroke-linecap="round" opacity="0.25"/>
  <line x1="560" y1="340" x2="900" y2="340" stroke="#345" stroke-width="2"/>
  <circle cx="560" cy="340" r="7" fill="#fff" stroke="#345"/><circle cx="900" cy="340" r="7" fill="#345"/>
  <text x="610" y="364" font-size="10" fill="#345">TRAK 2, vodoravno, 1,8 m</text>
  <g fill="#a0782a"><ellipse cx="640" cy="336" rx="9" ry="3"/><ellipse cx="720" cy="336" rx="9" ry="3"/><ellipse cx="800" cy="336" rx="9" ry="3"/></g>
  <rect x="890" y="350" width="22" height="22" fill="#2a5bd7"/><text x="886" y="386" font-size="9">M2</text>

  <!-- kamera 2 -->
  <rect x="780" y="214" width="40" height="22" fill="#333"/><path d="M788 236 L800 336 L812 236" fill="#9cf" opacity="0.35"/>
  <text x="730" y="208" font-size="9">KAMERA 2: stran B</text>
  <path d="M760 236 L760 334" stroke="#345" marker-end="url(#a)"/><path d="M760 334 L760 236" stroke="#345" marker-end="url(#a)"/><text x="736" y="290" font-size="9" fill="#345">500</text>
  <path d="M800 324 L896 324" stroke="#c00" marker-end="url(#a)"/><path d="M896 324 L800 324" stroke="#c00" marker-end="url(#a)"/>
  <text x="826" y="318" font-size="9" fill="#c00">0,5 m</text>

  <!-- izpih 2, izmet, škatla -->
  <rect x="914" y="318" width="14" height="10" fill="#e33"/><text x="886" y="300" font-size="9" fill="#c00">izpih 2</text>
  <path d="M920 330 L916 356" stroke="#c00" stroke-width="2" marker-end="url(#a)"/>
  <path d="M906 340 C930 340 950 360 960 390" stroke="#a0782a" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <path d="M908 350 C905 380 900 400 896 420" stroke="#c00" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <path d="M870 425 L915 425 L905 480 L880 480 Z" fill="#fde" stroke="#c00"/>
  <rect x="860" y="490" width="60" height="60" fill="none" stroke="#c00"/><text x="866" y="524" font-size="9" fill="#c00">IZMET</text>
  <path d="M945 395 L985 395 L975 470 L955 470 Z" fill="#f5e6c8" stroke="#8a6d3b"/>
  <rect x="930" y="480" width="60" height="60" fill="#f5e6c8" stroke="#8a6d3b"/><text x="934" y="514" font-size="9">ŠKATLA</text>
  <rect x="926" y="540" width="68" height="12" fill="#555"/><text x="932" y="570" font-size="9">tehtnica</text>
  <!-- izmet 1 zabojnik -->
  <rect x="480" y="480" width="60" height="60" fill="none" stroke="#c00"/><text x="486" y="514" font-size="9" fill="#c00">IZMET 1</text>

  <!-- noge -->
  <g stroke="#345" stroke-width="3"><line x1="140" y1="404" x2="140" y2="600"/><line x1="400" y1="324" x2="400" y2="600"/><line x1="600" y1="346" x2="600" y2="600"/><line x1="860" y1="346" x2="860" y2="490"/></g>
  <rect x="200" y="470" width="100" height="80" fill="#eee" stroke="#345"/><text x="206" y="494" font-size="9">el. omara</text><text x="206" y="508" font-size="9">PLC + PC vizija</text><text x="206" y="522" font-size="9">HMI</text>
  <rect x="640" y="490" width="40" height="70" rx="10" fill="#eee" stroke="#345"/><text x="642" y="528" font-size="8">zrak 10 L</text>
  <rect x="340" y="190" width="640" height="200" fill="none" stroke="#0a7" stroke-dasharray="6 4"/>
  <text x="344" y="184" font-size="9" fill="#076">zaprto ohišje vizije</text>

  <g font-size="10" fill="#123">
    <text x="40" y="636" font-weight="bold">1 trak 1, 0–2,2 m</text><text x="40" y="650">prekrite zdrsnejo nazaj</text>
    <text x="210" y="636" font-weight="bold">2 kamera 1 zgoraj</text><text x="210" y="650">stran A, 0,5 m do izpiha 1</text>
    <text x="400" y="636" font-weight="bold">3 izpih 1 + obrat</text><text x="400" y="650">slabe ven, dobre padejo na trak 2 in se obrnejo</text>
    <text x="680" y="636" font-weight="bold">4 kamera 2 zgoraj</text><text x="680" y="650">stran B, 0,5 m do izpiha 2</text>
    <text x="680" y="672" font-weight="bold">5 izpih 2 → dobre v škatlo</text><text x="680" y="686">na tehtnici</text>
  </g>
  <text x="40" y="700" font-size="10" fill="#555">Obe kameri gledata od zgoraj, obe imata pol metra časa za izračun, ni kamere pod trakom in ni reže.</text>
</svg>
